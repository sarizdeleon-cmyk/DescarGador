name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o descargador-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar
        working-directory: descargador-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp descargador-android/app/build/outputs/apk/release/app-release.apk Descargador-de-videos.apk
          gh release create "apk-${{ github.run_number }}" Descargador-de-videos.apk --title "APK ${{ github.run_number }}" --notes "Listo"
