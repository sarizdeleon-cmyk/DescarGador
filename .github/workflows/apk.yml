name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: unzip -q -o descargador-android.zip

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Compilar el APK
        working-directory: descargador-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Poner nombre al APK
        run: cp descargador-android/app/build/outputs/apk/release/app-release.apk Descargador-de-videos.apk
